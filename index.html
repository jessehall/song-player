<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#192522"><meta name="description" content="Your songs, wherever you listen."><title>Wiener Dawg playah</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css?v=15"><script src="app.js?v=14" defer></script></head>

<strong>Add to Home Screen</strong>, then <strong>Add</strong>.</p><img src="images/ios-home-screen.png" alt="Add to Home Screen option circled in the iOS share menu" width="960" height="603" loading="lazy"></li></ol><button id="close">Got it</button></dialog></body></html>
